# GatesPlus – Nederlandse meldingen. {0}, {1}, ... zijn waarden; &-codes zijn kleuren.
help: |-
  &6&lGatesPlus &7– poorten van (bijna) elk blok
  &e/gp create &7– start een nieuwe poort (je krijgt de selectiebijl)
  &e/gp get markerblock &7– markerblokken voor linksboven (1) en rechtsonder (2)
  &e/gp set block <blok> &7– kies het blok (&e/gp list blocks&7)
  &e/gp set trigger &7– kies het trigger-blok met de bijl
  &e/gp set direction <vertical|horizontal> &7– richting van de animatie
  &e/gp set animation <enabled|disabled> &7– animatie aan/uit
  &e/gp set redstone <normal|inverted> &7– omgekeerde redstone
  &e/gp set indestructible <on|off> &7– onbreekbaar of breekbaar
  &e/gp set fireproof <on|off> &7– vuurvast of brandbaar
  &e/gp set group <groep|none> &7– poort delen met een groep
  &e/gp confirm <naam> &7– bouw de poort
  &e/gp cancel &7– stop de sessie
  &e/gp edit <id|naam> &7– pas een poort aan
  &e/gp list &7– jouw poorten  &e/gp list all &7– alle poorten (admin)  &e/gp info <id|naam> &7– details
  &e/gp repair [id|naam] &7– herstel met blokken uit je inventory (zonder naam: de poort die je bewerkt)
  &e/gp rm <id|naam> &7– verwijder een poort
  &e/gp group create|delete|add|remove|list|members|gates|info &7– groepen
no_permission: "&cDaar heb je geen rechten voor."

