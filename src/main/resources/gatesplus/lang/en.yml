# GatesPlus – English messages. {0}, {1}, ... are values; &-codes are colours.
help: |-
  &6&lGatesPlus &7– gates made of (almost) any block
  &e/gp create &7– start a new gate (you get the selection axe)
  &e/gp get markerblock [amount] &7– marker blocks to set corners in mid-air
  &e/gp set block <block> &7– choose the block (&e/gp list blocks&7)
  &e/gp set trigger &7– choose the trigger block with the axe
  &e/gp set direction <vertical|horizontal> &7– animation direction
  &e/gp set animation <enabled|disabled> &7– animation on/off
  &e/gp set redstone <normal|inverted> &7– inverted redstone
  &e/gp set group <group|none> &7– share the gate with a group
  &e/gp confirm <name> &7– build the gate
  &e/gp cancel &7– stop the session
  &e/gp edit <id|name> &7– change a gate
  &e/gp list &7– your gates  &e/gp info <id|name> &7– details
  &e/gp repair <id|name> &7– repair using blocks from your inventory
  &e/gp rm <id|name> &7– remove a gate
  &e/gp group create|delete|add|remove|list|members|gates|info &7– groups
no_permission: "&cYou don't have permission to do that."

